[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentree"
version = "0.1.0"
description = "A minimal agent framework where agents spawn sub-agents: recursion, context isolation, and fan-out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
agentree = "agentree.cli:main"
agentree-server = "agentree.server:main"

[tool.setuptools.packages.find]
include = ["agentree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio -q"
